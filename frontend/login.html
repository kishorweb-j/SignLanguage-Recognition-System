<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign in | SignVoice</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

<header class="navbar">
    <a class="brand" href="index.html">✋ SignVoice</a>

    <nav>
        <a href="index.html">Home</a>
        <a href="recognition.html">Recognize</a>
        <a href="signup.html">Create account</a>
    </nav>
</header>

<main class="auth-page">

    <form id="loginForm" class="auth-card glass">

        <p class="eyebrow">WELCOME BACK</p>

        <h1>Sign in</h1>

        <p class="muted">
            Access your recognition history.
        </p>

        <label>
            Email
            <input
                id="email"
                type="email"
                placeholder="Enter your email"
                required
            >
        </label>

        <label>
            Password
            <input
                id="password"
                type="password"
                minlength="6"
                placeholder="Enter your password"
                required
            >
        </label>

        <button class="btn primary full" type="submit">
            Login
        </button>

        <p id="authMessage" class="message"></p>

        <p class="switch">
            New here?
            <a href="signup.html">Create an account</a>
        </p>

    </form>

</main>

<script type="module" src="js/auth.js"></script>

</body>
</html>
