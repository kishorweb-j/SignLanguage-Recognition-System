<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create account | SignVoice</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

<header class="navbar">
    <a class="brand" href="index.html">✋ SignVoice</a>

    <nav>
        <a href="index.html">Home</a>
        <a href="recognition.html">Recognize</a>
        <a href="login.html">Login</a>
    </nav>
</header>

<main class="auth-page">

    <form id="signupForm" class="auth-card glass">

        <p class="eyebrow">GET STARTED</p>

        <h1>Create account</h1>

        <p class="muted">
            Create an account to save recognition history.
        </p>

        <label>
            Name
            <input
                id="name"
                type="text"
                placeholder="Enter your name"
                required
            >
        </label>

        <label>
            Email
            <input
                id="email"
                type="email"
                placeholder="Enter your email"
                required
            >
        </label>

        <label>
            Password
            <input
                id="password"
                type="password"
                minlength="6"
                placeholder="Minimum 6 characters"
                required
            >
        </label>

        <button class="btn primary full" type="submit">
            Create Account
        </button>

        <p id="authMessage" class="message"></p>

        <p class="switch">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </form>

</main>

<script type="module" src="js/auth.js"></script>

</body>
</html>
